name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -p cli/tsconfig.json --noEmit && npx tsc -p cli/tsconfig.scripts.json
      - name: Test
        run: npm test --prefix cli
      - name: Validate skills
        run: npm run validate
      - name: Decoupling guard
        run: npm run check:decoupling
      - name: Catalog drift
        run: |
          npm run catalog
          git diff --exit-code -- catalog.json CATALOG.md
